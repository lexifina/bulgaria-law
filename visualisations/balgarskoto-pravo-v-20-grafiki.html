* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }

.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.3 Inter, sans-serif; overflow-wrap: anywhere; hyphens: auto; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }

.sub { margin: 18px 0 4px; font: 600 13px/1.3 Inter, sans-serif; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {

// a law's name inside a sentence: Bulgarian puts the article on the first word only, short ("закона", "наказателния")
// as an object and full ("законът", "наказателният") as a subject
function lawForm(k, f) {
  if (LANG !== 'bg') return 'the ' + lawName(k);
  const w = (LAWN[k] ? LAWN[k][0] : Cap(k)).split(' ');
  let a = w[0];
  if (a === 'Закон' || a === 'Закона') a = f === 'subj' ? 'Законът' : 'Закона';
  else if (a === 'Кодекс' || a === 'Кодекса') a = f === 'subj' ? 'Кодексът' : 'Кодекса';
  else if (/ен$/.test(a)) a = a.slice(0, -2) + (f === 'subj' ? 'ният' : 'ния');
  else if (/ски$/.test(a)) a = a + (f === 'subj' ? 'ят' : 'я');
  else if (/и?я$/.test(a) && f === 'subj') a = a + 'т';
  w[0] = a;
  return w.join(' ');
}

        L(`бюджетите за ${R.filter(r => !r.inf).map(r => r.y)[0]}–${d3.max(R.filter(r => !r.inf), r => r.y)} г. са задържани в data/held.json: за тях е известен само броят на „Държавен вестник“, а денят му е взет от другите актове в същия брой; денят на влизане в сила не е в записа. Бюджетите за 2019–2021 г. влизат в сила още през декември (общият им ден), преди годината.`,
          `the budgets for ${R.filter(r => !r.inf).map(r => r.y)[0]}–${d3.max(R.filter(r => !r.inf), r => r.y)} are held back in data/held.json: only their State Gazette issue is known, its day taken from the other acts in that issue; their day of entry into force is not in the record. The budgets for 2019–2021 take effect in December (their general day), before the year.`));
      table(el, [L('Бюджетна година', 'Budget year'), L('Приет', 'Adopted'), L('Обнародван', 'Published'), L('В сила от', 'In force from'), L('Дни след 1 януари', 'Days after 1 January')],
        R.map(r => [String(r.y), r.en || '–', r.pub || '–', r.inf || '–', r.inf ? DAYS(jan(r), r.inf) : '–']));

        L('за всеки закон се взема най-новото позоваване в текстовете (то изброява всички броеве преди него) и се добавят законите в хранилището, които го изменят след това; поправките на грешки („попр.“) и решенията на Конституционния съд не се броят. Засегнатите закони са тези, които изменя закон с текст в хранилището. Областта се чете от името на закона (правилата са в src/prep.py). 2026 г. е непълна (по-светла).',

  const pk = R.map(r => ({ r, y: +Object.entries(r.by).sort((a, b) => b[1] - a[1])[0][0], n: d3.max(Object.values(r.by)) })).sort((a, b) => b.n - a.n)[0];
  return {
    title: L(`Най-често изменяните закони: ${lawForm(top.name, 'subj')} — ${fmt(top.n)} пъти за 2004–2026 г.`, `The most-amended laws: the ${lawName(top.name)}, ${fmt(top.n)} times in 2004–2026`),
    dek: L(`Всеки ред е закон, всяко квадратче — година: колкото по-тъмно, толкова повече броеве на „Държавен вестник“ са го изменили. ${lawForm(top.name, 'subj')} е изменян средно ${dec(top.n / Y.length, 1)} пъти годишно${pk.r === top ? `, а през ${pk.y} г. — ${pk.n} пъти` : `; най-много изменения за една година има ${lawForm(pk.r.name, 'subj')} (${pk.n} през ${pk.y} г.)`}. ${Cap(words(pre))} от 25-те закона са обнародвани преди 2000 г.`,
      `Each row is a law, each cell a year: the darker, the more State Gazette issues amended it. The ${lawName(top.name)} was amended ${dec(top.n / Y.length, 1)} times a year on average${pk.r === top ? `, and ${pk.n} times in ${pk.y}` : `; the most amendments in one year belong to the ${lawName(pk.r.name)} (${pk.n} in ${pk.y})`}. ${Cap(words(pre))} of the 25 laws were first published before 2000.`),
    draw(el) {
      const w = W(el), nw = narrow(w), rowH = 21, m = { t: 20, r: nw ? 30 : 64, b: 4, l: nw ? 132 : 330 };
      const iw = w - m.l - m.r, cw = iw / Y.length, h = m.t + m.b + rowH * R.length;
      const mx = d3.max(R, r => d3.max(Object.values(r.by))), ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi'));
      const col = n => ramp(0.15 + 0.85 * Math.sqrt(n / mx));
      legend(el, [1, 3, 6, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} изменения за година`, `${n} amendments in a year`) : String(n) })).concat([{ c: css('--surface-2'), l: L('година без изменение', 'a year with no amendment') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      Y.forEach((y, j) => { if (y % (nw ? 10 : 2) === 0) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -7).attr('text-anchor', 'middle').text(nw ? y : "'" + String(y).slice(2)); });
      const xb = d3.scaleLinear().domain([0, d3.max(R, r => r.n)]).range([0, m.r - (nw ? 4 : 30)]);
      R.forEach((r, i) => {
        const cy = i * rowH, born = r.orig ? r.orig[0] : 0;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 14).attr('text-anchor', 'end').text(lawName(r.name));
        Y.forEach((y, j) => {
          if (y < born) return;
          const n = r.by[y] || 0;
          g.append('rect').attr('x', j * cw + 0.75).attr('y', cy + 2).attr('width', Math.max(1, cw - 1.5)).attr('height', rowH - 4).attr('rx', Math.min(3, cw / 3)).attr('fill', n ? col(n) : css('--surface-2')).attr('opacity', y === 2026 ? .6 : 1);
        });
        if (!nw) g.append('path').attr('d', barPath(iw + 8, cy + 6, iw + 8 + xb(r.n), rowH - 12, 2)).attr('fill', css('--s1'));
        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 4 : 12) + (nw ? 0 : xb(r.n))).attr('y', cy + 14).text(r.n);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${esc(lawName(d.name))}</b>` + (d.orig ? trow(null, L('Обнародван', 'First published'), L(`ДВ, бр. ${d.orig[1]} от ${d.orig[0]} г.`, `SG issue ${d.orig[1]} of ${d.orig[0]}`)) : '') +
            trow(null, L('Изменения 2004–2026', 'Amendments 2004–2026'), fmt(d.n)) + trow(null, L('Изменения от обнародването', 'Amendments since first published'), fmt(d.all)) +
            trow(null, L('В друг закон', 'In another law'), pct(d.n - d.own, d.n)));
      });
      note(el, ['zakon/**/uvod.md', 'zakon/**/par-*.md (обн., ДВ …; изм., бр. …)'], fmt(sum(R, r => r.n)) + L(' изменения', ' amendments'),
        L('изменение е всеки брой на „Държавен вестник“, който изменя или допълва закона, по най-новото позоваване на закона в текстовете на хранилището, плюс законите в хранилището след него; поправките не се броят. Числото вдясно е за 2004–2026 г.; 2026 г. е непълна (по-светла).',
          'an amendment is each State Gazette issue that amends or supplements the law, from the newest citation of the law in the repository\'s texts, plus the laws in the repository after it; corrections are not counted. The number on the right is for 2004–2026; 2026 is partial (lighter).'));
      table(el, [L('Закон', 'Law'), L('Обнародван', 'First published'), ...Y.map(String), t('total')], R.map(r => [lawName(r.name), r.orig ? `${r.orig[1]}/${r.orig[0]}` : '–', ...Y.map(y => r.by[y] || 0), r.n]));
    }
  };
});

      `The repository holds the Constitution in four versions: from 2008, after the 2015 amendment (SG issue 100), after the 2023 amendment (issue 106) and after the Constitutional Court's decision of 2024 (issue 66). Each cell is the number of provisions in the chapter that a version changes; on the right, the provisions in the chapter. In 2015, ${fmt(jud.v2015)} of ${fmt(T('v2015'))} changes were in the judiciary, in 2024 ${fmt(jud.v2024)} of ${fmt(T('v2024'))}.`),
    draw(el) {
      const w = W(el), nw = narrow(w), rowH = 30, cwid = nw ? 52 : 92, m = { t: 34, r: nw ? 40 : 120, b: 6, l: nw ? 124 : 300 };
      const iw = cwid * ev.length, h = m.t + m.b + rowH * R.length;
      const mx = d3.max(R, r => d3.max(ev, k => r[k])), ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi')), col = n => ramp(0.2 + 0.8 * Math.sqrt(n / mx));
      const EVN = [L('2015 · ДВ, бр. 100', '2015 · SG issue 100'), L('2023 · ДВ, бр. 106', '2023 · SG issue 106'), L('2024 · ДВ, бр. 66 (КС)', '2024 · SG issue 66 (Court)')];
      const EV1 = ['2015', '2023', '2024'], EV2 = [L('ДВ 100', 'issue 100'), L('ДВ 106', 'issue 106'), L('ДВ 66, КС', 'issue 66, Court')];
      legend(el, [1, 3, 6, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} разпоредби`, `${n} provisions`) : String(n) })).concat([{ c: css('--surface-2'), l: L('без промяна', 'no change') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      ev.forEach((k, j) => {
        g.append('text').attr('class', 'lbl strong').attr('x', j * cwid + cwid / 2).attr('y', -18).attr('text-anchor', 'middle').text(EV1[j]);
        if (!nw) g.append('text').attr('class', 'lbl mut').attr('x', j * cwid + cwid / 2).attr('y', -5).attr('text-anchor', 'middle').style('font-size', '10px').text(EV2[j]);
      });
      const ux = d3.scaleLinear().domain([0, d3.max(R, r => r.units)]).range([0, Math.max(30, w - m.l - iw - (nw ? 48 : 80))]);
      R.forEach((r, i) => {
        const cy = i * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -10).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(L(CHAPN[i], CHAPE[i]));
        ev.forEach((k, j) => {
          const n = r[k];
          bindTip(g.append('rect').attr('x', j * cwid + 2).attr('y', cy + 3).attr('width', cwid - 4).attr('height', rowH - 6).attr('rx', 5).attr('fill', n ? col(n) : css('--surface-2')).datum({ r, k, n, j }),
            d => `<b>${L(CHAPN[d.r.i], CHAPE[d.r.i])}</b>` + trow(null, EVN[d.j], `${fmt(d.n)} ${L('от', 'of')} ${fmt(d.r.units)}`));
          if (n) g.append('text').attr('class', 'lbl').attr('x', j * cwid + cwid / 2).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(col(n))).style('pointer-events', 'none').text(n);
        });
        g.append('path').attr('d', barPath(iw + 14, cy + 9, iw + 14 + ux(r.units), rowH - 18, 3)).attr('fill', css('--muted-mark'));
        g.append('text').attr('class', 'lbl').attr('x', iw + 20 + ux(r.units)).attr('y', cy + rowH / 2 + 4).text(r.units);
      });
      if (!nw) g.append('text').attr('class', 'lbl mut').attr('x', iw + 14).attr('y', -5).text(L('разпоредби в главата', 'provisions in the chapter'));
      note(el, ['konstitutsiya/', 'git log --name-status -- konstitutsiya'], fmt(sum(R, r => r.units)) + L(' разпоредби', ' provisions'),
        L('разпоредба е файлът на един член (или параграф на преходните разпоредби); промяна е всеки файл, който commit-ът на версията променя или добавя. Най-старата версия е от 2008 г.; текстът от 1991 г. и измененията от 2003–2007 г. не са в хранилището. Текстът от 2023 г. на 14-те разпоредби, по които Конституционният съд се произнася през 2024 г., в източника липсва.',
          'a provision is the file of one article (or one paragraph of the transitional provisions); a change is any file a version\'s commit changes or adds. The oldest version is from 2008; the 1991 text and the amendments of 2003–2007 are not in the repository. The 2023 wording of the 14 provisions the Constitutional Court ruled on in 2024 is missing from the source.'));
      table(el, [L('Глава', 'Chapter'), L('Разпоредби', 'Provisions'), '2015', '2023', '2024'], R.map((r, i) => [L(CHAPN[i], CHAPE[i]), r.units, r.v2015, r.v2023, r.v2024]));
    }
  };
});

chart('c12', el => {
  const c = D.c12, rows = c.years.map(([y, n]) => ({ y, n })), top = c.top.slice(0, 10);
  const pk = rows.reduce((a, b) => b.n > a.n ? b : a);
  return {
    title: L(`Конституционният съд в историята на законите: ${fmt(c.n)} решения засягат ${fmt(c.laws)} закона, най-много ${lawForm(top[0][0], 'obj')} (${top[0][1]})`,
      `The Constitutional Court in the record of laws: ${fmt(c.n)} decisions touch ${fmt(c.laws)} laws, the ${lawName(top[0][0])} most (${top[0][1]})`),
    dek: L(`Позоваванията на законите изброяват и решенията на Конституционния съд, които обявяват разпоредби за противоконституционни („Решение № 19 на Конституционния съд от 1995 г. – бр. 97 от 1995 г.“). Вляво — тези решения по години; най-много са през ${pk.y} г. (${pk.n}). Вдясно — законите, засегнати от най-много решения.`,
      `The laws' citations also list the Constitutional Court decisions that struck down provisions ("Решение № 19 на Конституционния съд от 1995 г. – бр. 97 от 1995 г."). Left: those decisions by year; the most were in ${pk.y} (${pk.n}). Right: the laws touched by the most decisions.`),
    draw(el) {
      const cols = S8(), ink = cols[6], box = el.append('div').attr('class', 'mini');
      const a = box.append('div'), b = box.append('div');
      a.append('h4').text(L('Решения по години', 'Decisions by year'));
      stackedColumns(a, rows, ['n'], [ink], [L('Решения', 'Decisions')], { h: 240, pad: 0.2, noShare: true, every: 5, tick: r => r.y % 5 === 0 });
      b.append('h4').text(L('Най-често засегнати закони', 'Laws touched most often'));
      barList(b, top, { v: r => r[1], color: () => ink, label: r => lawName(r[0]), rowH: 30, tip: r => `<b>${esc(lawName(r[0]))}</b>` + trow(null, L('Решения на КС', 'Court decisions'), fmt(r[1])) });
      note(el, ['zakon/**/uvod.md', 'zakon/**/par-*.md (Решение № … на Конституционния съд …)'], fmt(c.n) + L(' решения', ' decisions'),
        L('решение е двойката номер и година; годината е тази на решението. Тук са само решенията, които позоваването на закон в текстовете на хранилището изброява, т.е. за закони, изменени след решението със закон с текст в хранилището. Решенията за тълкуване на Конституцията не са сред тях.',
          'a decision is the pair of its number and year; the year is the decision\'s. Only decisions that a law\'s citation in the repository\'s texts lists are here, i.e. for laws amended after the decision by a law with text in the repository. Decisions interpreting the Constitution are not among them.'));
      table(el, [t('year'), L('Решения', 'Decisions')], rows.filter(r => r.n).map(r => [String(r.y), r.n]));
    }
  };
});

part('p4', 'IV. Подзаконовите актове и „Държавен вестник“', 'IV. Secondary legislation and the State Gazette',
  'Актовете от официалния раздел на „Държавен вестник“ освен законите: постановления на Министерския съвет, наредби, правилници и инструкции, с датите им на издаване, обнародване и влизане в сила (трейлърите Enacted:, Published:, In-force: в историята).',
  'The acts in the official section of the State Gazette other than laws: Council of Ministers decrees, ordinances, rules and instructions, with the days they were issued, published and took effect (the Enacted:, Published:, In-force: trailers in the history).');

const KIND = { law: ['Закони и кодекси', 'Laws and codes'], decree: ['Постановления на Министерския съвет', 'Council of Ministers decrees'], ordinance: ['Наредби', 'Ordinances'],
  rules: ['Правилници', 'Rules (правилници)'], instruction: ['Инструкции', 'Instructions'] };
chart('c13', el => {
  const R = D.c13, keys = ['law', 'decree', 'ordinance', 'rules', 'instruction'];
  const T = k => sum(R, r => r[k] || 0), law = T('law'), ex = T('decree') + T('ordinance') + T('rules') + T('instruction'), held = T('notext');
  return {
    title: L(`„Държавен вестник“: на всеки закон се падат ${dec(ex / law, 1)} акта на изпълнителната власт`, `The State Gazette: ${dec(ex / law, 1)} acts of the executive for every law`),
    dek: L(`Актовете от официалния раздел на „Държавен вестник“ по години и вид: тези с текст в хранилището, задържаните (data/held.json) и законите, известни само от записа на Народното събрание (data/laws.csv). От 2003 г. насам вестникът е обнародвал ${fmt(law)} закона и ${fmt(ex)} постановления, наредби, правилници и инструкции; ${pct(T('decree'), ex)} от тях са постановления на Министерския съвет.`,
      `The acts in the official section of the State Gazette by year and kind: those with text in the repository, those held back (data/held.json) and the laws known only from the National Assembly's record (data/laws.csv). Since 2003 the Gazette has published ${fmt(law)} laws and ${fmt(ex)} decrees, ordinances, rules and instructions; ${pct(T('decree'), ex)} of them are Council of Ministers decrees.`),
    draw(el) {
      const cols = S8(), colors = [cols[0], cols[3], cols[2], cols[6], css('--muted-mark')];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: L(...KIND[k]) })));
      stackedColumns(el, R, keys, colors, keys.map(k => L(...KIND[k])), { partial: r => r.y === 2026, pad: 0.18, h: 300, every: 3, everyN: 5 });
      note(el, ['zakon/', 'kodeks/', 'postanovlenie/', 'naredba/', 'pravilnik/', 'instruktsiya/', 'data/held.json', 'data/laws.csv'], fmt(law + ex) + L(' акта', ' acts'),
        L(`от тях ${fmt(held)} нямат текст в хранилището: задържани са, защото не се четат чисто (липсва разпоредба за влизане в сила или номер на материала, текстът е само в PDF и др.), или са известни само от записа на законите; заглавието и броят им са известни. ${fmt(PF.held_outside)} задържани материала, отпечатани извън раздела на вида си (например кодексите на Международната морска организация), не са включени. Актовете, които назовават лица (назначения, награди), не са в обхвата. ${R[R.length - 1].y} г. е непълна (по-светла).`,
          `of these, ${fmt(held)} have no text in the repository: they are held back because they do not read cleanly (no entry-into-force clause or material number, text only in the PDF, etc.), or known only from the record of laws; their title and issue are known. ${fmt(PF.held_outside)} held-back items printed outside the section of their kind (the International Maritime Organization's codes, for example) are left out. Acts naming people (appointments, awards) are out of scope. ${R[R.length - 1].y} is partial (lighter).`));
      table(el, [t('year'), ...keys.map(k => L(...KIND[k])), L('От тях без текст', 'Of which without text'), t('total')], R.map(r => [String(r.y), ...keys.map(k => r[k] || 0), r.notext || 0, sum(keys, k => r[k] || 0)]));
    }
  };
});

chart('c14', el => {
  const R = D.c14, N = sum(R, r => sum(r.wd)), tf = sum(R, r => r.wd[1] + r.wd[4]);
  const off = R.map(r => ({ y: r.y, n: sum(r.wd) - r.wd[1] - r.wd[4] })), omx = d3.max(off, r => r.n), oms = off.filter(r => r.n === omx).map(r => r.y);
  const WD = L(['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'нд'], ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']);
  return {
    title: L(`„Държавен вестник“ излиза във вторник и петък: ${pct(tf, N)} от броевете`, `The State Gazette comes out on Tuesdays and Fridays: ${pct(tf, N)} of issues`),
    dek: L(`Всеки ред е година, всяко квадратче — ден от седмицата: колко броя на „Държавен вестник“ са излезли в него (по деня, който актовете в броя отпечатват). Броевете в другите дни са ${fmt(N - tf)}, най-много през ${oms.join(' и ')} г. (${oms.length > 1 ? 'по ' : ''}${omx}). Вдясно — броят на броевете през годината.`,
      `Each row is a year, each cell a weekday: how many State Gazette issues came out on it (by the day the acts in the issue print). Issues on other days number ${fmt(N - tf)}, the most in ${oms.join(' and ')} (${omx}${oms.length > 1 ? ' each' : ''}). On the right, the issues in the year.`),
    draw(el) {
      const w = W(el), nw = narrow(w), rowH = 19, m = { t: 22, r: nw ? 44 : 250, b: 6, l: 38 };
      const iw = Math.min(w - m.l - m.r, 7 * 96), cw = iw / 7, h = m.t + m.b + rowH * R.length;
      const mx = d3.max(R, r => d3.max(r.wd)), ramp = d3.interpolateRgb(css('--seq-lo'), css('--seq-hi')), col = n => ramp(0.15 + 0.85 * Math.sqrt(n / mx));
      legend(el, [1, 5, 25, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} броя`, `${n} issues`) : String(n) })).concat([{ c: css('--surface-2'), l: L('нито един брой', 'no issue') }]));
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      WD.forEach((d, j) => g.append('text').attr('class', 'lbl strong').attr('x', j * cw + cw / 2).attr('y', -8).attr('text-anchor', 'middle').text(d));
      const xb = d3.scaleLinear().domain([0, d3.max(R, r => sum(r.wd))]).range([0, w - m.l - iw - (nw ? 40 : 60)]);
      R.forEach((r, i) => {
        const cy = i * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -6).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(r.y);
        r.wd.forEach((n, j) => bindTip(g.append('rect').attr('x', j * cw + 1).attr('y', cy + 1).attr('width', cw - 2).attr('height', rowH - 2).attr('rx', 3).attr('fill', n ? col(n) : css('--surface-2')).datum({ r, j, n }),
          d => `<b>${d.r.y} · ${WD[d.j]}</b>` + trow(null, L('Броеве', 'Issues'), fmt(d.n))));
        const tot = sum(r.wd);
        if (!nw) g.append('path').attr('d', barPath(iw + 10, cy + 5, iw + 10 + xb(tot), rowH - 10, 2)).attr('fill', css('--s1')).attr('opacity', r.y === 2026 ? .55 : 1);
        g.append('text').attr('class', 'lbl').attr('x', iw + (nw ? 8 : 16 + xb(tot))).attr('y', cy + rowH / 2 + 4).text(fmt(tot));
      });
      note(el, ['git log (Published:, dv<брой>)'], fmt(N) + L(' броя', ' issues'),
        L('брой е номерът на „Държавен вестник“ в годината, а денят му е денят на обнародване на актовете в него; броеве без нито един акт в историята на хранилището не се броят. 2026 г. е непълна (по-светла).',
          'an issue is the State Gazette number within its year, and its day the publication day of the acts in it; issues with no act in the repository\'s history are not counted. 2026 is partial (lighter).'));
      table(el, [t('year'), ...WD, t('total'), L('Най-висок номер', 'Highest number')], R.map(r => [String(r.y), ...r.wd, sum(r.wd), r.max_no]));
    }
  };
});

const DK = { spend: ['Одобряват разходи, трансфери или промени по бюджета', 'Approve spending, transfers or budget changes'], amend: ['Изменят, допълват или отменят други актове', 'Amend, supplement or repeal other acts'],
  rules: ['Приемат наредба, правилник, тарифа и др.', 'Adopt an ordinance, rules, a tariff etc.'], other: ['Други', 'Other'] };
chart('c15', el => {
  const R = D.c15, keys = ['spend', 'amend', 'rules', 'other'], tt = r => sum(keys, k => r[k] || 0);
  const r04 = R.find(r => r.y === 2004), r24 = R.find(r => r.y === 2024);
  const recent = R.filter(r => r.y >= 2014 && r.y <= 2025), lo = d3.min(recent, r => r.spend / tt(r)), hi = d3.max(recent, r => r.spend / tt(r));
  return {
    title: L(`Постановленията на правителството: през 2024 г. ${pct(r24.spend, tt(r24))} от тях одобряват допълнителни разходи или трансфери`, `Government decrees: in 2024, ${pct(r24.spend, tt(r24))} of them approved extra spending or transfers`),
    dek: L(`Постановленията на Министерския съвет по години, според заглавието им: за одобряване на допълнителни разходи, трансфери или промени по бюджета; за изменение, допълнение или отмяна на други актове; за приемане на наредба, правилник, тарифа и пр.; други. През 2004 г. разходните са ${pct(r04.spend, tt(r04))}, от 2014 до 2025 г. — между ${pv(100 * lo)} и ${pv(100 * hi)}.`,
      `Council of Ministers decrees by year, by their titles: approving additional spending, transfers or budget changes; amending, supplementing or repealing other acts; adopting an ordinance, rules, a tariff and the like; other. In 2004 the spending decrees were ${pct(r04.spend, tt(r04))}; from 2014 to 2025, between ${pv(100 * lo)} and ${pv(100 * hi)}.`),
    draw(el) {
      const cols = S8(), colors = [cols[1], cols[0], cols[2], css('--muted-mark')];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: L(...DK[k]) })));
      stackedColumns(el, R, keys, colors, keys.map(k => L(...DK[k])), { partial: r => r.y === 2026, pad: 0.18, h: 300, every: 3, everyN: 5, topLabel: r => pct(r.spend || 0, tt(r)), topSize: '9px',
        topIf: (r, nw) => !nw || [2004, 2009, 2014, 2019, 2024].includes(r.y) });
      note(el, ['postanovlenie/', 'git log (Act:)', 'data/held.json'], fmt(sum(R, tt)) + L(' постановления', ' decrees'),
        L('видът се чете от началото на заглавието („за одобряване на допълнителни разходи…“, „за изменение и допълнение на…“, „за приемане на Наредба…“; правилата са в src/prep.py). Числото над стълба е делът на разходните постановления. Включени са и задържаните постановления (по заглавие). 2026 г. е непълна (по-светла).',
          'the kind is read from the start of the title ("за одобряване на допълнителни разходи…", "за изменение и допълнение на…", "за приемане на Наредба…"; rules in src/prep.py). The number above each column is the share of spending decrees. Held-back decrees are included (by title). 2026 is partial (lighter).'));
      table(el, [t('year'), ...keys.map(k => L(...DK[k])), t('total'), t('share')], R.map(r => [String(r.y), ...keys.map(k => r[k] || 0), tt(r), pct(r.spend || 0, tt(r))]));
    }
  };
});

const EB = { before: ['Преди обнародването', 'Before publication'], same: ['В деня на обнародването', 'On the day of publication'], d12: ['1–2 дни след него', '1–2 days after'],
  d3: ['На третия ден (чл. 5, ал. 5)', 'On the third day (art. 5(5))'], m1: ['4–31 дни след него', '4–31 days after'], later: ['По-късно', 'Later'] };
chart('c16', el => {
  const c = D.c16, R = c.rows.map(r => ({ ...r })), keys = ['before', 'same', 'd12', 'd3', 'm1', 'later'], tt = r => sum(keys, k => r[k] || 0);
  const lw = R.find(r => r.k === 'law'), dc = R.find(r => r.k === 'decree');
  return {
    title: L(`Влизане в сила: всяко шесто постановление действа, преди да е обнародвано`, `Entry into force: one government decree in six takes effect before it is published`),
    dek: L(`Денят, в който актът влиза в сила, спрямо деня на обнародването му в „Държавен вестник“. По Конституцията (чл. 5, ал. 5) нормативните актове влизат в сила три дни след обнародването им, освен когато в тях е определен друг срок: така е при ${pct(lw.d3, tt(lw))} от законите. ${fmt(dc.before)} от ${fmt(tt(dc))} постановления (${pct(dc.before, tt(dc))}) влизат в сила преди деня на броя, ${fmt(c.adopt_day.decree)} от тях — в деня на приемането си.`,
      `The day an act takes effect, against the day the State Gazette published it. Under the Constitution (art. 5(5)), statutory acts take effect three days after promulgation unless they set another term: so it is for ${pct(lw.d3, tt(lw))} of laws. ${fmt(dc.before)} of ${fmt(tt(dc))} decrees (${pct(dc.before, tt(dc))}) take effect before the day of their issue, ${fmt(c.adopt_day.decree)} of them on the day they were adopted.`),
    draw(el) {
      const cols = S8(), colors = [cols[7], cols[4], cols[3], cols[0], cols[2], css('--muted-mark')];

      const byIso = new Map(bil.filter(r => ISO_N[r.k]).map(r => [ISO_N[r.k], r])), byName = new Map(bil.filter(r => NAME_N[r.k]).map(r => [NAME_N[r.k], r]));
      legend(el, [1, 5, 15, mx].map(n => ({ c: col(n), l: n === mx ? L(`${n} закона`, `${n} laws`) : String(n) })).concat([{ c: css('--s2'), l: L('България', 'Bulgaria') }]));
      const box = el.append('div').attr('class', 'mini'), pe = box.append('div'), pw = box.append('div');
      pe.append('h4').text(L('Европа и Близкият изток', 'Europe and the Middle East')); pw.append('h4').text(L('Светът', 'The world'));
      const draws = [];
      const map = (div, mk, hh) => {
        const w = W(div), h = Math.round(w * hh), svg = svgIn(div, w, h).style('overflow', 'hidden');
        draws.push(() => {
          const land = topojson.feature(WORLD, WORLD.objects.countries).features.filter(f => f.id !== '010');
          const proj = mk(w, h), path = d3.geoPath(proj), rec = f => byIso.get(f.id) || byName.get(f.properties.name);
          bindTip(svg.append('g').selectAll('path').data(land).join('path').attr('d', path).attr('stroke', css('--surface')).attr('stroke-width', .6)
            .attr('fill', f => f.id === '100' ? css('--s2') : rec(f) ? col(rec(f).n) : css('--surface-2')),
            f => { const r = rec(f); return f.id === '100' ? `<b>${L('България', 'Bulgaria')}</b>` : `<b>${r ? esc(ctryName(r.k)) : esc(f.properties.name)}</b>` + trow(null, L('Закони за ратифициране', 'Ratification laws'), fmt(r ? r.n : 0)); });
        });
      };
      const eu = { type: 'MultiPoint', coordinates: [[-10, 28], [57, 23], [-9, 62], [50, 62], [24, 69]] };
      map(pe, (w, h) => d3.geoConicConformal().parallels([30, 58]).rotate([-22, 0]).fitExtent([[0, 0], [w, h]], eu), 0.82);
      map(pw, (w, h) => d3.geoNaturalEarth1().fitExtent([[0, 0], [w, h]], { type: 'Sphere' }), 0.52);
      const fail = () => box.append('p').attr('class', 'note').text(L('Картата не можа да се зареди (cdn.jsdelivr.net); числата са в графиката отдолу и в таблицата.', 'The map could not be loaded (cdn.jsdelivr.net); the numbers are in the chart below and the table.'));
      if (WORLD) draws.forEach(f => f()); else worldAtlas().then(() => draws.forEach(f => f())).catch(fail);
      const dcol = [0.3, 0.5, 0.72, 0.95].map(ramp), top = bil.slice(0, 16);
      el.append('h4').attr('class', 'sub').text(L('Най-често назовавани държави, по периоди', 'The states named most, by period'));
      legend(el, c.periods.map((l, i) => ({ c: dcol[i], l })));
      const w = W(el), nw = narrow(w), rowH = 22, m = { t: 2, r: 40, b: 4, l: nw ? 120 : 170 };
      const svg = svgIn(el, w, m.t + m.b + rowH * top.length), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleLinear().domain([0, mx]).range([0, iw]);
      top.forEach((r, i) => {
        const cy = i * rowH; let acc = 0;
        g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(ctryName(r.k));
        r.by.forEach((n, j) => { if (!n) return; const last = r.by.slice(j + 1).every(z => !z);
          g.append('path').attr('d', last ? barPath(x(acc), cy + 5, x(acc + n), 13, 3) : `M${x(acc)},${cy + 5}h${Math.max(0, x(acc + n) - x(acc) - 1)}v13h${-Math.max(0, x(acc + n) - x(acc) - 1)}Z`).attr('fill', dcol[j]); acc += n; });
        g.append('text').attr('class', 'lbl').attr('x', x(r.n) + 6).attr('y', cy + 15).text(r.n);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', cy).attr('height', rowH).datum(r),
          d => `<b>${esc(ctryName(d.k))}</b>` + c.periods.map((p, j) => trow(dcol[j], p, fmt(d.by[j]))).join('') + trow(null, t('total'), fmt(d.n)));
      });
      note(el, ['zakon/', 'data/laws.csv', 'data/held.json (Закон за ратифициране …)'], fmt(N) + L(' закона за ратифициране', ' ratification laws'),
        L('страната се чете от имената на държави в заглавието (правилата са в src/prep.py); мястото на подписване („подписан … в Букурещ, Румъния“) не се брои, а един закон може да се брои за няколко държави. Малките държави (Сан Марино, Лихтенщайн, Малта…) не се виждат на картата; те са в таблицата. Карта: world-atlas (Natural Earth).',
          'the other party is read from state names in the title (rules in src/prep.py); the place of signature ("подписан … в Букурещ, Румъния") does not count, and one law can count for several states. Small states (San Marino, Liechtenstein, Malta…) are too small for the map; they are in the table. Map: world-atlas (Natural Earth).'));
      table(el, [L('Държава', 'State'), ...c.periods, t('total')], c.rows.map(r => [ctryName(r.k), ...r.by, r.n]));
    }
  };
});

chart('c20', el => {
  const R = D.c20.map(r => ({ y: r.y, lev: r.lev, eur: r.eur, laws: r.laws })), e = r => r.eur / Math.max(1, r.eur + r.lev);
  const r26 = R.find(r => r.y === 2026), r24 = R.find(r => r.y === 2024), pre = R.filter(r => r.y <= 2021), preMax = d3.max(pre, e);
  return {
    title: L(`Еврото: ${pct(r26.eur, r26.eur + r26.lev)} от паричните суми в законите от 2026 г. са в евро`, `The euro: ${pct(r26.eur, r26.eur + r26.lev)} of the money amounts in 2026's laws are in euro`),
    dek: L(`Всички парични суми в текстовете на законите от всяка година (без ратификациите), според валутата, в която са записани: лева или евро. До 2021 г. делът на еврото е най-много ${pv(100 * preMax)}; през 2024 г. той е ${pct(r24.eur, r24.eur + r24.lev)} заради Закона за въвеждане на еврото в Република България (ДВ, бр. 70 от 2024 г.), който прави еврото валута на страната от датата, определена в решението на Съвета на ЕС; в законите от 2026 г. сумите в евро вече са повече от тези в лева.`,
      `Every money amount in the texts of each year's laws (treaty ratifications aside), by the currency it is written in: leva or euro. Up to 2021 the euro's share is at most ${pv(100 * preMax)}; in 2024 it is ${pct(r24.eur, r24.eur + r24.lev)}, because of the Euro Introduction Act (SG issue 70 of 2024), which makes the euro the country's currency from the date set in the decision of the Council of the EU; in the laws of 2026, amounts in euro outnumber those in leva.`),
    draw(el) {
      const ink = css('--s1'), names = [L('В евро', 'In euro'), L('В лева', 'In leva')];
      legend(el, [{ c: ink, l: L('Дял на сумите в евро', 'Share of amounts in euro'), shape: 'line' }, { c: ink, l: L(`${R[R.length - 1].y} г. (непълна година)`, `${R[R.length - 1].y} (partial year)`), shape: 'ring' }]);
      const w = W(el), nw = narrow(w), h = nw ? 250 : 290, m = { t: 26, r: nw ? 36 : 60, b: 26, l: 44 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const x = d3.scaleLinear().domain([R[0].y, R[R.length - 1].y]).range([0, iw]), y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      yAxis(g, y, iw, 5, v => pv(100 * v));
      d3.range(R[0].y, R[R.length - 1].y + 1, nw ? 6 : 2).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      g.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(.5)).attr('y2', y(.5)).attr('stroke', css('--text-3')).attr('stroke-dasharray', '3 3');
      g.append('text').attr('class', 'lbl mut').attr('x', 4).attr('y', y(.5) - 6).text(L('половината от сумите', 'half of the amounts'));
      const full = R.slice(0, -1), last = R[R.length - 1], prev = full[full.length - 1];
      g.append('path').attr('d', d3.area().x(r => x(r.y)).y0(ih).y1(r => y(e(r)))(full)).attr('fill', grad(svg, 'c20g', ink, .32));
      g.append('path').attr('d', d3.line().x(r => x(r.y)).y(r => y(e(r)))(full)).attr('fill', 'none').attr('stroke', ink).attr('stroke-width', 2.2).attr('stroke-linejoin', 'round');
      g.append('path').attr('d', `M${x(prev.y)},${y(e(prev))}L${x(last.y)},${y(e(last))}`).attr('stroke', ink).attr('stroke-width', 2).attr('stroke-dasharray', '3 3');
      bindTip(g.append('g').selectAll('circle').data(R).join('circle').attr('cx', r => x(r.y)).attr('cy', r => y(e(r))).attr('r', 3.4)
        .attr('fill', r => r === last ? css('--surface') : ink).attr('stroke', ink).attr('stroke-width', 1.5),
        r => `<b>${r.y}${r === last ? ' (' + t('partial') + ')' : ''}</b>` + trow(ink, names[0], `${fmt(r.eur)} · ${pct(r.eur, r.eur + r.lev)}`) + trow(null, names[1], fmt(r.lev)) + trow(null, L('Закони', 'Laws'), fmt(r.laws)));
      // labels on the points that carry the story
      g.append('text').attr('class', 'lbl strong').attr('x', x(R[0].y) + 2).attr('y', y(e(R[0])) - 9).text(pct(R[0].eur, R[0].eur + R[0].lev));
      [2022, 2024].forEach(yy => { const r = R.find(q => q.y === yy); g.append('text').attr('class', 'lbl strong').attr('x', x(yy)).attr('y', y(e(r)) - 9).attr('text-anchor', 'middle').text(pct(r.eur, r.eur + r.lev)); });
      g.append('text').attr('class', 'lbl strong').attr('x', x(last.y) - 8).attr('y', y(e(last)) + 4).attr('text-anchor', 'end').text(pct(last.eur, last.eur + last.lev));
      const r24 = R.find(q => q.y === 2024);
      if (!nw) {
        const ax = x(2024), ay = y(e(r24));
        g.append('path').attr('d', `M${ax},${ay - 22}V${ay - 40}H${ax - 14}`).attr('fill', 'none').attr('stroke', css('--text-3'));
        g.append('text').attr('class', 'lbl mut').attr('x', ax - 18).attr('y', ay - 36).attr('text-anchor', 'end').text(L('Закон за въвеждане на еврото (ДВ, бр. 70 от 2024 г.)', 'Euro Introduction Act (SG issue 70 of 2024)'));
      }
      note(el, ['zakon/**/*.md (… лв., … лева, … евро)'], fmt(sum(R, r => r.eur + r.lev)) + L(' суми в ', ' amounts in ') + fmt(sum(R, r => r.laws)) + L(' закона', ' laws'),
        L('сума е число, последвано от „лв.“, „лева“ или „евро“ (и „хил.“, „млн.“, „млрд.“); закон, който заменя сума в лева със сума в евро, съдържа и двете. Годината е годината на броя на „Държавен вестник“. 2026 г. е непълна (кухата точка).',
          'an amount is a number followed by "лв.", "лева" or "евро" (with "хил.", "млн.", "млрд."); a law that replaces an amount in leva with one in euro holds both. The year is that of the State Gazette issue. 2026 is partial (the hollow dot).'));
      table(el, [t('year'), names[0], names[1], t('share'), L('Закони', 'Laws')], R.map(r => [String(r.y), r.eur, r.lev, pct(r.eur, r.eur + r.lev), r.laws]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'p2', 'c05', 'c06', 'c07', 'c08', 'c09', 'c10', 'p3', 'c11', 'c12', 'p4', 'c13', 'c14', 'c15', 'c16', 'c17', 'p5', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html(''), K = P.kinds;
  const rows = [
    [L('Историята в git (всички commit-и)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`актовете на „Държавен вестник“ от ${dateTxt(P.first_pub)} до ${dateTxt(P.built)}`, `State Gazette acts from ${dateTxt(P.first_pub)} to ${dateTxt(P.built)}`), L('commit-ът е датиран с деня на влизане в сила; денят на броя е в трейлъра Published:', 'a commit is dated the day it took effect; the issue day is in its Published: trailer')],
    [L('Актове с текст', 'Acts with text'), 'zakon/ kodeks/ postanovlenie/ naredba/ pravilnik/ instruktsiya/', fmt(P.acts), L(`${fmt(K.law)} закона, ${fmt(K.decree)} постановления, ${fmt(K.ordinance)} наредби, ${fmt(K.rules)} правилника, ${fmt(K.instruction)} инструкции`, `${fmt(K.law)} laws, ${fmt(K.decree)} decrees, ${fmt(K.ordinance)} ordinances, ${fmt(K.rules)} rules, ${fmt(K.instruction)} instructions`), L('по една версия: текстът при приемането', 'one version each: the text as enacted')],
    [L('Задържани актове', 'Held-back acts'), 'data/held.json', fmt(P.held), '2003–2026', L('само заглавие и брой на вестника; не се четат чисто', 'title and issue only; they do not read cleanly')],
    [L('Записът на законите', 'Record of laws'), 'data/laws.csv', fmt(P.laws_csv), L('ден на приемане, обнародване и влизане в сила', 'days of adoption, publication and entry into force'), L('и закони без текст в хранилището', 'includes laws with no text in the repository')],
    [L('Позовавания в законите', 'Citations in laws'), 'zakon/**/uvod.md, par-*.md', `${fmt(P.amend_events)} ${L('изменения', 'amendments')}`, L(`историята на измененията на ${fmt(P.laws_with_record)} закона`, `the amendment history of ${fmt(P.laws_with_record)} laws`), L('само законите, които закон в хранилището изменя', 'only laws a law in the repository amends')],
    [L('Конституцията', 'Constitution'), 'konstitutsiya/', L('4 версии', '4 versions'), '2008, 2015, 2023, 2024', L('без текста от 1991 г. и измененията от 2003–2007 г.', 'without the 1991 text and the 2003–2007 amendments')],
    [L('Решения на Народното събрание (2026)', 'National Assembly decisions (2026)'), 'reshenie/', '–', '2026', L('само за първото заседание на 52-рото събрание', 'only for the 52nd assembly\'s first sitting')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) room = this.getBoundingClientRect().right - this.ownerSVGElement.getBoundingClientRect().left - 2;
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG === 'bg' ? 'bg' : 'en';
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  d3.select('[data-theme-set="auto"]').text(L('Авто', 'Auto'));
  const tl = t('tiles'), tv = [PF.commits, PF.acts, PF.laws_record, PF.amend_events, PF.issues, D.c01.rows.length];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.bg, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dbg, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.bg, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('bg-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('bg-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
</script>
